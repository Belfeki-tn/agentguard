name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -v
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pip check
      - run: git diff --check
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'hatchling>=1.27,<2'
      - run: python -m hatchling build
      - run: python scripts/check_artifacts.py dist
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agentguard-wheel"
          "$RUNNER_TEMP/agentguard-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentguard-wheel/bin/agentguard" --help
          "$RUNNER_TEMP/agentguard-wheel/bin/agentguard" status
          "$RUNNER_TEMP/agentguard-wheel/bin/python" -m pip check
      - name: Build and install source distribution in a separate environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agentguard-sdist"
          "$RUNNER_TEMP/agentguard-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentguard-sdist/bin/agentguard" policy test --help
          "$RUNNER_TEMP/agentguard-sdist/bin/python" -m pip check
