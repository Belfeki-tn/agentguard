[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard-mcp"
version = "0.0.1"
description = "Local-first MCP tool permission gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Belfeki.tn"}]
maintainers = [{name = "Belfeki.tn"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["mcp", "security", "ai-agents", "permissions"]
dependencies = [
    "typer>=0.12,<1", "rich>=13,<15", "pydantic>=2,<3", "PyYAML>=6,<7",
    "mcp>=2.3,<2.4", "anyio>=4.9,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "hypothesis>=6,<7", "hatchling>=1.27,<2"]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs", "/scripts", "/.github",
    "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CONTRIBUTING.md",
    "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.sqlite3", "**/*.db", "**/.env"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
