# Version 1 policy. Standalone parsing/evaluation is implemented; MCP enforcement is planned.
# Exact server.tool matching; deny > approve > allow, first rule wins ties.
version: 1
defaults:
  action: deny
rules:
  - id: allow-read
    tools: ["filesystem.read_file"]
    action: allow
  - id: review-production-deploy
    tools: ["deploy.production"]
    action: approve
  - id: block-database-drop
    tools: ["database.drop"]
    action: deny
